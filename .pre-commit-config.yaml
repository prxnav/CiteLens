# Runs the same checks as CI before every commit. Uses the project's own
# uv environment, so versions match pyproject.toml exactly.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy citelens tests scripts
        language: system
        pass_filenames: false
        types: [python]
