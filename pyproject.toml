[project]
name = "citelens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pymupdf ships a py.typed marker but its C-extension methods aren't
# actually annotated, so strict mode's disallow_untyped_calls fires on
# every call into it. Relaxed only for this one boundary module.
module = "citelens.pdf"
disallow_untyped_calls = false
